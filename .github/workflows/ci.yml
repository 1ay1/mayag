name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── the matrix that matters ──────────────────────────────────────────
  #
  # mayag claims to run everywhere out of the box. That claim is only worth
  # something if it is mechanically checked on every push, on every OS, with
  # both major compilers, and — critically — with NO GPU present. The software
  # backend and the built-in font mean these runners need nothing installed.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cxx: g++-14
            install: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build

          - name: linux-clang
            os: ubuntu-24.04
            cxx: clang++-19
            install: |
              sudo apt-get update
              sudo apt-get install -y ninja-build clang-19 libstdc++-14-dev

          - name: macos-gcc
            os: macos-14
            cxx: g++-14
            install: brew install gcc@14 ninja

          - name: windows-msvc
            os: windows-2022
            cxx: cl
            install: choco install ninja -y

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: ${{ matrix.install }}
        shell: bash

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows-msvc'

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        shell: bash

      - name: Build
        run: cmake --build build -j
        shell: bash

      - name: Test
        run: ctest --test-dir build --output-on-failure
        shell: bash

      # Rendering with no GPU is the whole point of the software backend.
      - name: Render examples headlessly
        run: |
          ./build/examples/mayag_dashboard || ./build/examples/mayag_dashboard.exe
          ./build/examples/mayag_gallery   || ./build/examples/mayag_gallery.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.name }}
          path: "*.png"

  # ── the Linux backend, against a REAL compositor ─────────────────────
  #
  # The protocol tables are the risky part of the Wayland backend: libwayland
  # does not export xdg-shell, so mayag transcribes those interface
  # descriptors by hand, and a wrong signature or opcode is not a compile
  # error — it is a wire desync that only shows up against a live server.
  # The other jobs run the pure-logic half of the test; this one runs a
  # headless compositor (weston, offscreen) so the live half executes too,
  # exercising the real handshake: bind, configure, attach, damage, commit.
  wayland:
    name: linux-wayland
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compositor and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build weston \
            libwayland-client0 libxkbcommon0 \
            glslc mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build -j --target mayag_wayland_tests mayag_vulkan_tests mayag_counter

      # No compositor: the backend must degrade, not crash. This is the
      # property that lets the same binary ship to every Linux box.
      - name: Degrades without a compositor
        run: |
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET ./build/mayag_wayland_tests
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET ./build/examples/mayag_counter --headless

      # The GPU-vs-software equivalence test, against Mesa's software Vulkan
      # device (lavapipe). Proves the Vulkan backend produces the reference
      # image — the default renderer must be correct, not just present.
      - name: Vulkan matches software (lavapipe)
        run: |
          # lavapipe registers its own ICD in the default search path; forcing a
          # filename is fragile across Mesa versions, so rely on discovery.
          export VK_LOADER_DRIVERS_SELECT="*lvp*"
          ./build/mayag_vulkan_tests

      # With a compositor: the live half of the suite runs for real, and the
      # window brings up a real Vulkan swapchain on lavapipe.
      - name: Test against weston
        run: |
          export XDG_RUNTIME_DIR=/tmp/wl-run
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-ci --idle-time=0 &
          for i in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-ci
          # lavapipe registers its own ICD in the default search path; forcing a
          # filename is fragile across Mesa versions, so rely on discovery.
          export VK_LOADER_DRIVERS_SELECT="*lvp*"
          ./build/mayag_wayland_tests

  # ── determinism across platforms ─────────────────────────────────────
  #
  # The software rasteriser is the reference every GPU backend is measured
  # against, so it must produce IDENTICAL bytes everywhere. If Linux and macOS
  # disagree, the "reference" is not one.
  determinism:
    name: cross-platform determinism
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: renders-*, path: renders }
      - name: Compare renders byte-for-byte
        run: |
          cd renders
          for f in renders-linux-gcc/*.png; do
            base=$(basename "$f")
            for other in renders-*/; do
              if ! cmp -s "$f" "$other$base"; then
                echo "::error::$base differs between linux-gcc and $other"
                exit 1
              fi
            done
          done
          echo "all backends agree byte-for-byte"

  # ── warnings are errors, in the headers users actually include ───────
  strict:
    name: strict warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build with -Werror
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=g++-14 \
                -DCMAKE_CXX_FLAGS="-Werror"
          cmake --build build -j

  # ── sanitizers ───────────────────────────────────────────────────────
  sanitize:
    name: ${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        san: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build and test with -fsanitize=${{ matrix.san }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_CXX_COMPILER=g++-14 \
                -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.san }}"
          cmake --build build -j --target mayag_tests
          ./build/mayag_tests
